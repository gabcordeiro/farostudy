<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F17" />

    <!-- Favicon set (checklist producao #6) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fontes proprias (evita Inter/Geist/Space Grotesk) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />

    <!-- SEO base (sobrescrito por pagina via <SEO/> / react-helmet) -->

    <meta
      name="description"
      content="Faro Cards transforma editais e textos em flashcards com IA e agenda suas revisoes por repeticao espacada. Estude no ritmo certo."
    />
    <link rel="canonical" href="https://farocards.app/" />

    <!-- Open Graph (checklist producao #5) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Faro Cards" />

      property="og:description"

    <meta property="og:image" content="https://farocards.app/og-image.png" />
