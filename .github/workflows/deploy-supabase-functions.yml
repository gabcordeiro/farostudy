name: Deploy Supabase Edge Functions

# Deploy 100% pelo navegador: sem CLI local, sem clonar o projeto.
# Requer dois secrets no repositorio (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  - gerado em https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    - o project ref (ex: sfzwudfivragjmqaxjrh)
#
# Dispara automaticamente quando supabase/functions/** muda em main, ou
# manualmente pela aba Actions > Deploy Supabase Edge Functions > Run workflow.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: supabase functions deploy generate-cards --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
